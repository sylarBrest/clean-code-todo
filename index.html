<!doctype html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" media="screen" />
  </head>

  <body class="page">
    <header class="header">
      <h1 class="header__caption">
        <img class="header__image" src="./eisenhower-matrix.jpg" alt="The Eisenhower matrix" />
      </h1>
      <a class="header__link" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
    </header>
    <main class="main">
      <section class="add main__add">
        <h2 class="caption add__caption">Add Item</h2>
        <ul class="list add__list">
          <li class="item list__item list__item_new">
            <label for="new-task" class="item__label item__label_display_none">New Task</label>
            <input id="new-task" class="item__input item__text item__text_add" type="text" />
            <button class="item__button item__button_add" type="button">Add</button>
          </li>
        </ul>
      </section>
      <section class="todo main__todo">
        <h2 class="caption todo__caption">Todo</h2>
        <ul class="list list__todo">
          <li class="item list__item">
            <input class="item__input item__checkbox" type="checkbox" />
            <label for="task-1" class="item__label">Pay Bills</label>
            <input id="task-1" class="item__input item__text item__text_display_none" type="text" />
            <button class="item__button item__button_edit" type="button">Edit</button>
            <button class="button-delete item__button item__button_delete" type="button">
              <img class="button-delete__image" src="./remove.svg" alt="remove" />
            </button>
          </li>
          <li class="item list__item list__item_edit">
            <input class="item__input item__checkbox" type="checkbox" />
            <label for="task-2" class="item__label item__label_edit">Go Shopping</label>
            <input id="task-2" class="item__input item__text item__text_edit" type="text" value="Go Shopping" />
            <button class="item__button item__button_edit" type="button">Save</button>
            <button class="button-delete item__button item__button_delete" type="button">
              <img class="button-delete__image" src="./remove.svg" alt="remove" />
            </button>
          </li>
        </ul>
      </section>
      <section class="completed main__completed">
        <h2 class="caption completed__caption">Completed</h2>
        <ul class="list list__completed">
          <li class="item list__item">
            <input class="item__input item__checkbox item__checkbox_checked" type="checkbox" checked />
            <label for="task-3" class="item__label item__label_line_through">See the Doctor</label>
            <input id="task-3" class="item__input item__text item__text_display_none" type="text" />
            <button class="item__button item__button_edit" type="button">Edit</button>
            <button class="button-delete item__button item__button_delete" type="button">
              <img class="button-delete__image" src="./remove.svg" alt="remove" />
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
